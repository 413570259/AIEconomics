<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時全球主要國家通膨率 (CPI) 儀表板</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --card-bg: #ffffff;
            --bg-color: #f8fafc;
            --text-color: #334155;
            --accent-color: #2563eb;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .country-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .inflation-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--accent-color);
            margin: 16px 0 8px 0;
        }

        .date-info {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .loading {
            color: #94a3b8;
            font-size: 1.2rem;
        }

        .error {
            color: #ef4444;
            font-size: 0.9rem;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>全球主要國家即時通膨率 (CPI YoY)</h1>
        <p class="subtitle">數據來源：FRED (Federal Reserve Bank of St. Louis)</p>
    </header>

    <div class="grid" id="dashboard">
        <!-- 數據卡片由 JavaScript 動態生成 -->
    </div>

    <footer>
        <p>© 即時經濟數據追蹤儀表板 | 使用 FRED API 自動更新</p>
    </footer>
</div>

<script>
    const API_KEY = 'c367186e94cfb1becdecf2c6d2a202bd';

    const countries = [
        { name: "美國 (United States)", id: "CPIAUCSL", flag: "🇺🇸" },
        { name: "歐元區 (Euro Area)", id: "CP0000EZ19M086NEST", flag: "🇪🇺" },
        { name: "日本 (Japan)", id: "JPNCPIALLMINMEI", flag: "🇯🇵" },
        { name: "英國 (United Kingdom)", id: "GBRCPIALLMINMEI", flag: "🇬🇧" },
        { name: "加拿大 (Canada)", id: "CANCPIALLMINMEI", flag: "🇨🇦" },
        { name: "德國 (Germany)", id: "DEUCPIALLMINMEI", flag: "🇩🇪" }
    ];

    const dashboard = document.getElementById('dashboard');

    function initCards() {
        dashboard.innerHTML = countries.map(c => `
            <div class="card" id="card-${c.id}">
                <div class="country-name">
                    <span>${c.name}</span>
                    <span>${c.flag}</span>
                </div>
                <div class="inflation-value loading" id="val-${c.id}">載入中...</div>
                <div class="date-info" id="date-${c.id}">最新數據更新中</div>
            </div>
        `).join('');
    }

    async function fetchInflationData(seriesId) {
        const targetUrl = `https://api.stlouisfed.org/fred/series/observations?series_id=${seriesId}&api_key=${API_KEY}&file_type=json&units=pc1&sort_order=desc&limit=1`;
        const proxyUrl = `https://api.corsproxy.io/?${encodeURIComponent(targetUrl)}`;

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('網路回應錯誤');
            
            const data = await response.json();
            const latestObs = data.observations[0];
            
            return {
                value: parseFloat(latestObs.value).toFixed(2),
                date: latestObs.date
            };
        } catch (error) {
            console.error(`無法取得 ${seriesId} 資料:`, error);
            return null;
        }
    }

    async function loadDashboard() {
        initCards();

        for (const country of countries) {
            const result = await fetchInflationData(country.id);
            const valEl = document.getElementById(`val-${country.id}`);
            const dateEl = document.getElementById(`date-${country.id}`);

            if (result && result.value !== "NaN") {
                valEl.classList.remove('loading');
                valEl.innerText = `${result.value}%`;
                dateEl.innerText = `統計基期：${result.date}`;
            } else {
                valEl.classList.remove('loading');
                valEl.classList.add('error');
                valEl.innerText = '讀取失敗';
                dateEl.innerText = '請檢查 API Key 或 Series ID';
            }
        }
    }

    window.onload = loadDashboard;
</script>

</body>
</html>
