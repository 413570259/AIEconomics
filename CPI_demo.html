<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時全球主要國家通膨率 (CPI) 儀表板</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --card-bg: #ffffff;
            --bg-color: #f8fafc;
            --text-color: #334155;
            --accent-color: #2563eb;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95rem;
        }

        .api-key-banner {
            background-color: #fef3c7;
            border-left: 4px solid #d97706;
            padding: 12px 16px;
            margin-bottom: 24px;
            border-radius: 4px;
            font-size: 0.9rem;
            color: #92400e;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .country-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .inflation-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--accent-color);
            margin: 16px 0 8px 0;
        }

        .date-info {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .loading {
            color: #94a3b8;
            font-size: 1.2rem;
        }

        .error {
            color: #ef4444;
            font-size: 0.9rem;
            font-weight: 600;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>全球主要國家即時通膨率 (CPI YoY)</h1>
        <p class="subtitle">數據來源：FRED (Federal Reserve Bank of St. Louis)</p>
    </header>

    <div id="apiNotice" class="api-key-banner" style="display: none;">
        ⚠️ <strong>提示：</strong> 請確認已將您的 32 位元 FRED API Key 填入程式碼中的 <code>API_KEY</code> 變數。
    </div>

    <div class="grid" id="dashboard">
        <!-- 卡片區域 -->
    </div>

    <footer>
        <p>© 即時經濟數據追蹤儀表板 | 使用 FRED 原生 JSONP 自動更新</p>
    </footer>
</div>

<script>
    // 🔑 1. 請在此處替換為您的 32 位元 FRED API Key（去頭去尾不要有空白）
    const API_KEY = 'YOUR_FRED_API_KEY';

    // 🌐 2. 確定有效的國家數據系列 ID (FRED Series ID)
    const countries = [
        { name: "美國 (United States)", id: "CPIAUCSL", flag: "🇺🇸" },
        { name: "歐元區 (Euro Area)", id: "CP0000EZ19M086NEST", flag: "🇪🇺" },
        { name: "日本 (Japan)", id: "CPALTT01JPM659N", flag: "🇯🇵" },
        { name: "英國 (United Kingdom)", id: "CPALTT01GBM659N", flag: "🇬🇧" },
        { name: "加拿大 (Canada)", id: "CPALTT01CAM659N", flag: "🇨🇦" },
        { name: "德國 (Germany)", id: "CPALTT01DEM659N", flag: "🇩🇪" }
    ];

    const dashboard = document.getElementById('dashboard');

    // 全域動態 Callback 暫存物件
    window.fredCallbacks = {};

    function initCards() {
        if (!API_KEY || API_KEY === 'YOUR_FRED_API_KEY') {
            document.getElementById('apiNotice').style.display = 'block';
        }

        dashboard.innerHTML = countries.map(c => `
            <div class="card" id="card-${c.id}">
                <div class="country-name">
                    <span>${c.name}</span>
                    <span>${c.flag}</span>
                </div>
                <div class="inflation-value loading" id="val-${c.id}">連線資料庫中...</div>
                <div class="date-info" id="date-${c.id}">請稍候</div>
            </div>
        `).join('');
    }

    // 利用動態 <script> 標籤實現 JSONP，徹底解決跨域 CORS 阻擋
    function fetchInflationJSONP(country) {
        return new Promise((resolve) => {
            const callbackName = 'cb_' + country.id + '_' + Math.random().toString(36).substr(2, 5);
            
            // 逾時處理 (5秒)
            const timeout = setTimeout(() => {
                delete window.fredCallbacks[callbackName];
                resolve(null);
            }, 5000);

            // 註冊全域回傳函數
            window.fredCallbacks[callbackName] = function(data) {
                clearTimeout(timeout);
                delete window.fredCallbacks[callbackName];
                if (data && data.observations && data.observations.length > 0) {
                    const obs = data.observations[0];
                    if (obs.value !== "." && !isNaN(parseFloat(obs.value))) {
                        resolve({
                            value: parseFloat(obs.value).toFixed(2),
                            date: obs.date
                        });
                        return;
                    }
                }
                resolve(null);
            };

            // 構建官方 JSONP 請求 URL
            const script = document.createElement('script');
            script.src = `https://api.stlouisfed.org/fred/series/observations?series_id=${country.id}&api_key=${API_KEY}&file_type=jsonp&callback=fredCallbacks.${callbackName}&units=pc1&sort_order=desc&limit=1`;
            script.onerror = () => {
                clearTimeout(timeout);
                delete window.fredCallbacks[callbackName];
                resolve(null);
            };

            document.body.appendChild(script);
        });
    }

    async function loadDashboard() {
        initCards();

        for (const country of countries) {
            const result = await fetchInflationJSONP(country);
            const valEl = document.getElementById(`val-${country.id}`);
            const dateEl = document.getElementById(`date-${country.id}`);

            if (result) {
                valEl.classList.remove('loading');
                valEl.style.color = '#2563eb';
                valEl.innerText = `${result.value}%`;
                dateEl.innerText = `最新統計基期：${result.date}`;
            } else {
                valEl.classList.remove('loading');
                valEl.classList.add('error');
                valEl.innerText = '讀取失敗';
                dateEl.innerText = (!API_KEY || API_KEY === 'c367186e94cfb1becdecf2c6d2a202bd')
                    ? '未設定有效 API Key' 
                    : 'API Key 無效或網路阻擋';
            }
        }
    }

    window.onload = loadDashboard;
</script>

</body>
</html>
