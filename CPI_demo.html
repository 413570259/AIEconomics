<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美國即時通膨率 (CPI YoY) 歷史儀表板</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --card-bg: #ffffff;
            --bg-color: #f8fafc;
            --text-color: #334155;
            --accent-color: #2563eb;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95rem;
        }

        .status-banner {
            padding: 12px 16px;
            margin-bottom: 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f0fdf4;
            border: 1px solid #86efac;
            color: #15803d;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 24px;
        }

        .country-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .inflation-value {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent-color);
            margin: 16px 0 8px 0;
        }

        .date-info {
            font-size: 0.95rem;
            color: #64748b;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px 14px;
        }

        th {
            background-color: #f1f5f9;
            color: var(--primary-color);
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .loading {
            color: #94a3b8;
            font-size: 1.2rem;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>美國即時通膨率 (CPI YoY) 歷史時間序列</h1>
        <p class="subtitle">自動串接 World Bank / Open Economic Data 免費開放 API</p>
    </header>

    <div id="statusNotice" class="status-banner">
        <span>✅ 已成功連結開放經濟數據 API（無跨域阻擋問題）</span>
    </div>

    <!-- 最新一期重點卡片 -->
    <div class="card">
        <div class="country-name">
            <span>美國 (United States)</span>
            <span>🇺🇸</span>
        </div>
        <div class="inflation-value loading" id="latestVal">載入中...</div>
        <div class="date-info" id="latestDate">最新統計基期：---</div>
    </div>

    <!-- 過去 10 期歷史序列表格 -->
    <div class="card">
        <h3>📊 過去 10 期通膨率時間序列</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>統計年度 / 期別</th>
                        <th>CPI 通膨率 (YoY %)</th>
                        <th>資料來源</th>
                    </tr>
                </thead>
                <tbody id="seriesTable">
                    <tr><td colspan="3" style="text-align:center; color:#94a3b8;">資料載入中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer>
        <p>© 經濟數據自動化儀表板 | 開放資料庫介面</p>
    </footer>
</div>

<script>
    // 世界銀行美國通膨率 API（完全免金鑰、完全無 CORS 限制）
    const WB_API_URL = 'https://api.worldbank.org/v2/country/USA/indicator/FP.CPI.TOTL.ZG?format=json&per_page=10';

    async function fetchUSInflation() {
        try {
            const response = await fetch(WB_API_URL);
            if (!response.ok) throw new Error('網路回應異常');
            
            const data = await response.json();
            if (data && data[1] && data[1].length > 0) {
                return data[1].map(item => ({
                    date: item.date,
                    value: item.value ? parseFloat(item.value).toFixed(2) : "---"
                }));
            }
        } catch (err) {
            console.error('API 存取失敗:', err);
        }
        return null;
    }

    async function init() {
        const latestValEl = document.getElementById('latestVal');
        const latestDateEl = document.getElementById('latestDate');
        const tableBody = document.getElementById('seriesTable');

        const observations = await fetchUSInflation();

        if (observations && observations.length > 0) {
            const latest = observations[0];
            latestValEl.classList.remove('loading');
            latestValEl.innerText = `${latest.value}%`;
            latestDateEl.innerText = `最新統計基期：${latest.date} 年 (World Bank API)`;

            tableBody.innerHTML = observations.map((item, index) => `
                <tr>
                    <td><strong>${item.date} 年</strong> ${index === 0 ? '<span style="color:#2563eb; font-size:0.8rem; margin-left:4px;">(最新期)</span>' : ''}</td>
                    <td><span style="font-weight:bold; color:#2563eb;">${item.value}%</span></td>
                    <td>World Bank Open Data</td>
                </tr>
            `).join('');
        } else {
            latestValEl.classList.remove('loading');
            latestValEl.style.color = '#ef4444';
            latestValEl.innerText = '讀取失敗';
            latestDateEl.innerText = '請檢查網路連線';
            tableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#ef4444;">連線失敗</td></tr>`;
        }
    }

    window.onload = init;
</script>

</body>
</html>
