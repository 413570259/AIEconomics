<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美國即時通膨率 (CPI YoY) - API 診斷頁面</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --card-bg: #ffffff;
            --bg-color: #f8fafc;
            --text-color: #334155;
            --accent-color: #2563eb;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .debug-card {
            background-color: #1e293b;
            color: #f8fafc;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 24px;
            font-family: monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 24px;
        }

        .country-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .inflation-value {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent-color);
            margin: 16px 0 8px 0;
        }

        .date-info {
            font-size: 0.95rem;
            color: #64748b;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px 14px;
        }

        th {
            background-color: #f1f5f9;
            color: var(--primary-color);
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .loading {
            color: #94a3b8;
            font-size: 1.2rem;
        }

        .badge-success { background: #16a34a; color: white; padding: 2px 8px; border-radius: 4px; }
        .badge-danger { background: #dc2626; color: white; padding: 2px 8px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>美國 CPI 即時連線診斷儀表板</h1>
    </header>

    <!-- 除錯視窗 -->
    <div class="debug-card" id="debugLog">
        🔍 系統自我檢測中...<br>
    </div>

    <!-- 最新一期重點卡片 -->
    <div class="card">
        <div class="country-name">
            <span>美國 (United States)</span>
            <span>🇺🇸</span>
        </div>
        <div class="inflation-value loading" id="latestVal">載入中...</div>
        <div class="date-info" id="latestDate">最新統計基期：---</div>
    </div>

    <!-- 過去 10 期歷史序列表格 -->
    <div class="card">
        <h3>📊 過去 10 期通膨率時間序列</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>統計日期</th>
                        <th>CPI 年增率 (YoY %)</th>
                        <th>資料來源</th>
                    </tr>
                </thead>
                <tbody id="seriesTable">
                    <tr><td colspan="3" style="text-align:center; color:#94a3b8;">資料讀取中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // 🔑 1. 請在此處填入您向 FRED 申請到的 32 字元 API Key
    const API_KEY = '2ed09da231f98ab0d3eddfdcecd02875'; 

    const SERIES_ID = 'CPIAUCSL';
    const debugLog = document.getElementById('debugLog');

    function log(msg) {
        debugLog.innerHTML += msg + '<br>';
    }

    function fetchUSData() {
        return new Promise((resolve) => {
            // 清理前後空白
            const cleanKey = API_KEY.trim();

            log(`🔑 API Key 字元數長度檢查：<strong>${cleanKey.length}</strong> 字元`);
            
            if (!cleanKey || cleanKey === '2ed09da231f98ab0d3eddfdcecd02875') {
                log('❌ <span class="badge-danger">失敗原因</span>：您尚未更換 API_KEY 變數（仍為預設字串）。');
                resolve(null);
                return;
            }

            if (cleanKey.length !== 32) {
                log(`❌ <span class="badge-danger">失敗原因</span>：Key 長度不正確（應為 32 字元，目前為 ${cleanKey.length} 字元）。請檢查是否複製到名稱或包含了前後多餘字元。`);
                resolve(null);
                return;
            }

            const cbName = 'fred_cb_' + Math.floor(Math.random() * 100000);
            log(`🌐 正在向 FRED 發起 JSONP 請求 (Callback: ${cbName})...`);

            const timeout = setTimeout(() => {
                delete window[cbName];
                log('⏱️ <span class="badge-danger">連線逾時</span>：FRED 伺服器未於 5 秒內回應，可能是網路封鎖或 file:// 限制。');
                resolve(null);
            }, 5000);

            window[cbName] = function(data) {
                clearTimeout(timeout);
                delete window[cbName];

                if (data.error_code) {
                    log(`❌ <span class="badge-danger">FRED API 拒絕存取</span> (${data.error_code}): ${data.error_message}`);
                    resolve(null);
                    return;
                }

                if (data && data.observations && data.observations.length > 0) {
                    log('✅ <span class="badge-success">連線成功</span>：已成功從 FRED 撈取資料！');
                    const validObs = data.observations
                        .filter(o => o.value !== "." && !isNaN(parseFloat(o.value)))
                        .map(o => ({
                            date: o.date,
                            value: parseFloat(o.value).toFixed(2)
                        }));
                    resolve(validObs);
                    return;
                }
                log('⚠️ FRED 回傳空資料。');
                resolve(null);
            };

            const script = document.createElement('script');
            script.src = `https://api.stlouisfed.org/fred/series/observations?series_id=${SERIES_ID}&api_key=${cleanKey}&file_type=jsonp&callback=${cbName}&units=pc1&sort_order=desc&limit=10`;
            
            script.onerror = () => {
                clearTimeout(timeout);
                delete window[cbName];
                log('❌ <span class="badge-danger">Script 載入失敗</span>：瀏覽器阻擋了跨域腳本加載 (CORS / AdBlock / File Protocol 限制)。');
                resolve(null);
            };

            document.body.appendChild(script);
        });
    }

    async function init() {
        const latestValEl = document.getElementById('latestVal');
        const latestDateEl = document.getElementById('latestDate');
        const tableBody = document.getElementById('seriesTable');

        const observations = await fetchUSData();

        if (observations && observations.length > 0) {
            const latest = observations[0];
            latestValEl.classList.remove('loading');
            latestValEl.innerText = `${latest.value}%`;
            latestDateEl.innerText = `最新統計基期：${latest.date} (FRED API)`;

            tableBody.innerHTML = observations.map((item, index) => `
                <tr>
                    <td><strong>${item.date}</strong> ${index === 0 ? '<span style="color:#2563eb; font-size:0.8rem; margin-left:4px;">(最新期)</span>' : ''}</td>
                    <td><span style="font-weight:bold; color:#2563eb;">${item.value}%</span></td>
                    <td>FRED 官方 API</td>
                </tr>
            `).join('');
        } else {
            latestValEl.classList.remove('loading');
            latestValEl.style.color = '#ef4444';
            latestValEl.innerText = '讀取失敗';
            latestDateEl.innerText = '請查看上方黑色區塊的診斷訊息';
            tableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#ef4444;">連線失敗，請依診斷訊息修復</td></tr>`;
        }
    }

    window.onload = init;
</script>

</body>
</html>
