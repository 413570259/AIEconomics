<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美國即時通膨率 (CPI YoY) 與歷史 10 期序列</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --card-bg: #ffffff;
            --bg-color: #f8fafc;
            --text-color: #334155;
            --accent-color: #2563eb;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95rem;
        }

        .status-banner {
            padding: 12px 16px;
            margin-bottom: 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-warning {
            background-color: #fffbebf5;
            border: 1px solid #fcd34d;
            color: #b45309;
        }

        .status-success {
            background-color: #f0fdf4;
            border: 1px solid #86efac;
            color: #15803d;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 24px;
        }

        .country-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .inflation-value {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent-color);
            margin: 16px 0 8px 0;
        }

        .date-info {
            font-size: 0.95rem;
            color: #64748b;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px 14px;
        }

        th {
            background-color: #f1f5f9;
            color: var(--primary-color);
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .loading {
            color: #94a3b8;
            font-size: 1.2rem;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>美國即時通膨率 (CPI YoY) 與歷史 10 期序列</h1>
        <p class="subtitle">僅單一請求美國數據，避免多重 API 請求限制</p>
    </header>

    <div id="statusNotice" class="status-banner status-warning">
        <span>⚠️ 正在連線 FRED 伺服器...</span>
    </div>

    <!-- 最新一期重點卡片 -->
    <div class="card">
        <div class="country-name">
            <span>美國 (United States)</span>
            <span>🇺🇸</span>
        </div>
        <div class="inflation-value loading" id="latestVal">載入中...</div>
        <div class="date-info" id="latestDate">最新統計基期：---</div>
    </div>

    <!-- 過去 10 期歷史序列表格 -->
    <div class="card">
        <h3>📊 過去 10 期通膨率時間序列</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>期數 / 統計日期</th>
                        <th>CPI 年增率 (YoY %)</th>
                        <th>資料來源</th>
                    </tr>
                </thead>
                <tbody id="seriesTable">
                    <tr><td colspan="3" style="text-align:center; color:#94a3b8;">資料讀取中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer>
        <p>© 即時經濟數據測試網頁 | 使用 FRED 原生 API / JSONP</p>
    </footer>
</div>

<script>
    // 🔑 請在此處填入您的 32 位元 FRED API Key
    const API_KEY = 'c367186e94cfb1becdecf2c6d2a202bd';
    const SERIES_ID = 'CPIAUCSL'; // 美國消費者物價指數

    // 備援預設資料（當未填 Key 或網路請求受限時顯示）
    const fallbackData = [
        { date: "2026-09-01", value: "3.70" },
        { date: "2026-08-01", value: "3.60" },
        { date: "2026-07-01", value: "3.50" },
        { date: "2026-06-01", value: "3.40" },
        { date: "2026-05-01", value: "3.30" },
        { date: "2026-04-01", value: "3.40" },
        { date: "2026-03-01", value: "3.50" },
        { date: "2026-02-01", value: "3.20" },
        { date: "2026-01-01", value: "3.10" },
        { date: "2025-12-01", value: "3.40" }
    ];

    // 發起 1 次 JSONP 請求，抓取最近 10 期 (limit=10, units=pc1 計算年增率)
    function fetchUSData() {
        return new Promise((resolve) => {
            if (!API_KEY || API_KEY === 'c367186e94cfb1becdecf2c6d2a202bd' || API_KEY.length !== 32) {
                resolve(null);
                return;
            }

            const cbName = 'fred_us_cb_' + Math.floor(Math.random() * 100000);
            const timeout = setTimeout(() => {
                delete window[cbName];
                resolve(null);
            }, 4000);

            window[cbName] = function(data) {
                clearTimeout(timeout);
                delete window[cbName];
                if (data && data.observations && data.observations.length > 0) {
                    const validObs = data.observations
                        .filter(o => o.value !== "." && !isNaN(parseFloat(o.value)))
                        .map(o => ({
                            date: o.date,
                            value: parseFloat(o.value).toFixed(2)
                        }));
                    resolve(validObs);
                    return;
                }
                resolve(null);
            };

            const script = document.createElement('script');
            script.src = `https://api.stlouisfed.org/fred/series/observations?series_id=${SERIES_ID}&api_key=${API_KEY}&file_type=jsonp&callback=${cbName}&units=pc1&sort_order=desc&limit=10`;
            script.onerror = () => {
                clearTimeout(timeout);
                delete window[cbName];
                resolve(null);
            };
            document.body.appendChild(script);
        });
    }

    async function init() {
        const noticeEl = document.getElementById('statusNotice');
        const latestValEl = document.getElementById('latestVal');
        const latestDateEl = document.getElementById('latestDate');
        const tableBody = document.getElementById('seriesTable');

        const observations = await fetchUSData();

        let displayData = [];
        let sourceName = "";

        if (observations && observations.length > 0) {
            displayData = observations;
            sourceName = "FRED 官方 API";
            noticeEl.className = 'status-banner status-success';
            noticeEl.innerHTML = '<span>✅ 連線成功！已成功取得 FRED 官方最新 10 期美國通膨數據。</span>';
        } else {
            displayData = fallbackData;
            sourceName = "預設歷史資料庫 (備援)";
            noticeEl.className = 'status-banner status-warning';
            noticeEl.innerHTML = '<span>ℹ️ 未填寫有效 API Key 或請求受限，已啟用備援時間序列展示。</span>';
        }

        // 更新最新一期
        const latest = displayData[0];
        latestValEl.classList.remove('loading');
        latestValEl.innerText = `${latest.value}%`;
        latestDateEl.innerText = `最新統計基期：${latest.date} (${sourceName})`;

        // 渲染過去 10 期時間序列表格
        tableBody.innerHTML = displayData.map((item, index) => `
            <tr>
                <td><strong>${item.date}</strong> ${index === 0 ? '<span style="color:#2563eb; font-size:0.8rem; margin-left:4px;">(最新期)</span>' : ''}</td>
                <td><span style="font-weight:bold; color:#2563eb;">${item.value}%</span></td>
                <td>${sourceName}</td>
            </tr>
        `).join('');
    }

    window.onload = init;
</script>

</body>
</html>
