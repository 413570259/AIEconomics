<head>
    <meta charset="UTF-8">
    <title>教學講義</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --secondary-color: #2563eb;
            --accent-color: #d97706;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;
            --border-color: #e2e8f0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            line-height: 1.75; 
            color: var(--text-color); 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 24px; 
        }

        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); 
        }

        h1 { color: var(--primary-color); border-bottom: 3px solid var(--secondary-color); padding-bottom: 12px; margin-top: 0; font-size: 1.8rem; }
        h2 { color: var(--secondary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-top: 36px; font-size: 1.4rem; }
        h3 { color: var(--primary-color); margin-top: 24px; font-size: 1.15rem; }
        p, li { font-size: 1rem; }
        ul, ol { padding-left: 24px; }
        li { margin-bottom: 8px; }

        .highlight-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin: 24px 0; }
        .capability-card { background-color: #f8fafc; border: 1px solid var(--border-color); border-left: 4px solid var(--secondary-color); border-radius: 8px; padding: 20px; }
        .capability-card h4 { margin: 0 0 8px 0; color: var(--primary-color); font-size: 1.1rem; }

        .resource-box { background-color: #eff6ff; border-left: 4px solid var(--secondary-color); padding: 16px 20px; margin: 24px 0; border-radius: 0 8px 8px 0; }
        .quote-box { background-color: #fffbeb; border-left: 4px solid var(--accent-color); padding: 16px 20px; margin: 24px 0; border-radius: 0 8px 8px 0; }
        .formula-box { background-color: #f1f5f9; border-left: 4px solid var(--primary-color); padding: 14px 20px; margin: 16px 0; font-family: "Courier New", Courier, monospace; font-weight: bold; border-radius: 4px; }

        .table-container { overflow-x: auto; margin: 24px 0; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
        th, td { border: 1px solid var(--border-color); padding: 12px 16px; }
        th { background-color: #f1f5f9; color: var(--primary-color); font-weight: 600; }
        tr:nth-child(even) { background-color: #f8fafc; }

        .badge { display: inline-block; background-color: #e0e7ff; color: #3730a3; padding: 2px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: 600; }
        footer { margin-top: 50px; text-align: center; font-size: 0.9em; color: #64748b; border-top: 1px solid var(--border-color); padding-top: 20px; }
    </style> <!-- 請確認有這行結束標籤 -->
</head>
